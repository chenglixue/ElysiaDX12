; Engine defaults, taken from the last UserData.elysia save.
; Project overrides belong in DefaultEngine.ini.
; Keys changed at runtime are written to Saved/Config/Windows/Engine.ini.
; A later file replaces a scalar. + adds an array item, - removes one.
; The first .Key= in a later file clears the inherited array.

[Light]
; Spawn template / legacy singleton. Live directional lights are scene actors
; persisted under [Startup] DirectionalLight* arrays in Saved Engine.ini.
; Intensity / Color / Source Angle are edited on the light Inspector, not here.
Color=(X=1,Y=0.935409427,Z=0.843137264)
Direction=(X=0,Y=-1,Z=-0.076)
Intensity=5.918

[Material]
ShadingModel=Default Lit
BaseColorTint=(X=1,Y=1,Z=1)
Opacity=1
Cutoff=0.572
NormalIntensity=1.041
MetallicIntensity=0
RoughnessIntensity=0.751
AmbientCubemapIntensity=1
Specular=1
AmbientCubemapTint=(X=1,Y=1,Z=1)
EmissionTint=(X=0,Y=0,Z=0)

[Subsurface]
CurveScale=2
MinCurve=0.495
SubsurfaceColor=(X=0.270354152,Y=0.617647052,Z=0.16349481)
ScatterRadius=0.423
TransmissionScale=5
TransmissionRange=2
TransmissionEdgeGlow=0.532

[Hair]
EnableMultiScatter=true
EnableR=true
EnableTT=true
EnableTRT=true
BackLit=0.5

[Shadow]
; Spawn template / GPU fallback, mirrored from the main directional light
; (Atmosphere Sun, else the first directional). Edited in that light's Inspector.
Type=Soft
Quality=VeryHigh
DepthBias=0.52
SlopeDepthBias=1.887
MaxSlopeDepthBias=1.53
Radius=5
Distance=50
Enable=true
EnableTAA=true

[HDR]
Enable=true
Quality=High
Tonemap=LMP
ColorSpace=ColorSpace_REC709
DisplayMode=DISPLAYMODE_FSHDR_SCRGB
LocalExposure=1
Shoulder=true
SoftGap=0.5
HdrMax=2048
Exposure=11
Contrast=0.122
ShoulderContrast=1
Saturation=(X=0,Y=0,Z=0)
Crosstalk=(X=1,Y=1,Z=1)

[AO]
Enable=true
Radius=0.808
FadeRadius=5612.964
FadeDistance=6429.25
Bias=0.006
IntensityMul=0.5
IntensityPow=1.484
Lerp=false
TAALerpFactor=0.05
Blur=true
BlurCount=2
BlurQuality=High
BlurIntensity=1
Sharpness=0.765
DebugTarget=AO
HIZMipFactor=0.505
HIZMipmap=1
TAA=true
ImportanceIntensity=2
HIZRadius=1

[GI]
EnableLine=false
HideInactiveProbe=false
TextureVisualization=false
LineWidth=0
NormalBias=0.107
ViewBias=0.317
BlendWeight=0.97
Gamma=5
ProbeIrradianceThreshold=0.501
ProbeBrightnessThreshold=2.143
ProbeGroupOrigin=(X=-10.3,Y=-1.1,Z=-4.9)

[Debug]
Mode=None
MipmapLevel=0
InstanceID=62
EnableHIZ=false

[AutoExposure]
Enable=true
EnablePreExposure=true
FusionEnable=false
FusionHighlightContrast=0.8
FusionShadowContrast=1.25
LowPercent=0.1
HighPercent=0.9
HistogramLogMin=-10
HistogramLogMax=20
MinAverageLuminance=0.0009765625
MaxAverageLuminance=1048576
ExposureCompensation=0
; curve_test04.uasset FloatCurve. X is EV100, Y is bias in stops. All keys linear.
ExposureCompensationCurve=true
ExposureCompensationCurveKeys=-10,-2.75;-6,-2.75;-2,-1.9;0,-1.5;6,-1.5;11,-1.25;13,-0.25;15,0.5;16,3
MiddleGrey=0.18
SpeedUp=3
SpeedDown=1
ExponentialTransitionDistance=1.5
VisualizeHDR=false
VisualizeDebugType=SceneColor
VisualizeLuminanceScale=1

[Bloom]
Enable=true
Radius=1
Intensity=0
Mipmap=0
DebugDirection=Down

[TAA]
Enable=true
Jitter=Halton23X8
JitterIntensity=1.051
StaticWeight=0.951
DynamicWeight=0.1
MaxWeight=0.5
SampleRate=1

[Sharpen]
Enable=true
Amount=0.755

[SSSR]
RoughnessThreshold=1
SamplesPerQuad=1

[SSGI]
Enable=false
Intensity=1
MaxDistance=20
Thickness=1
SelfBias=0.05
HistoryWeight=0.9

; Pipeline-state precache. Compile graphics, compute, and the DDGI ray-tracing
; state object on a worker pool while pass setup is still compiling shaders.
; Cached driver blobs are stored in Saved/PSOCache/D3D12.pso.
; Validation: 0 quiet, 1 summary and misses, 2 also logs the disk key.
[PSOPrecache]
Enable=true
ThreadPercent=75
ThreadMin=2
ThreadMax=6
Validation=1
